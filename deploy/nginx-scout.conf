# Nginx — SCOUT ASCCI (VPS OVH). À copier dans /etc/nginx/sites-available/,
# remplacer paroisse.example.ci par le domaine réel, puis :
#   sudo nginx -t && sudo systemctl reload nginx
#
# Topologie (installation paroisse) : Nginx (443) → frontend paroissial
# (127.0.0.1:3002), qui relaie lui-même /api/* vers l'API NestJS
# (127.0.0.1:4000), non exposée directement. L'installation district a son
# propre bloc server : deploy/nginx-district.conf.

server {
    listen 80;
    server_name paroisse.example.ci;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name paroisse.example.ci;

    ssl_certificate     /etc/letsencrypt/live/paroisse.example.ci/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/paroisse.example.ci/privkey.pem;

    # Téléversements (photos, logos, PDF) : à aligner sur la limite de l'API.
    client_max_body_size 10m;

    # Les en-têtes de sécurité (CSP, HSTS, X-Frame-Options…) sont posés par
    # Next.js (next.config.ts) : pas de doublon ici.

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
