name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Lint, types, tests et build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Génère aussi le client Prisma (postinstall de @scout/api).
      - run: npm ci

      # Bloque les failles connues élevées ou critiques des dépendances livrées.
      - name: Audit des dépendances de production
        run: npm audit --omit=dev --audit-level=high

      - name: Paquet partagé
        run: npm run build -w @scout/shared

      - name: Validation du schéma Prisma
        run: npm exec -w @scout/api -- prisma validate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      - name: Lint
        run: npm run lint --workspaces --if-present

      - name: Vérification des types
        run: npm run typecheck --workspaces --if-present

      - name: Tests unitaires
        run: npm run test --workspaces --if-present

      - name: Build
        run: npm run build -w @scout/api -w @scout/web-paroisse -w @scout/web-district
        env:
          # Obligatoire pour un build de production des frontends (relais /api).
          API_URL_INTERNE: http://127.0.0.1:4000
          NEXT_PUBLIC_SITE_URL: https://ci.example.invalid

  docker-build:
    name: Build des images Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: API (sans publication)
        run: docker build -f apps/api/Dockerfile -t scout-api:ci .

      - name: Chargement du client Prisma compilé
        run: docker run --rm --entrypoint node scout-api:ci -e "require('./dist/generated/prisma/client.js')"

      - name: Frontend paroissial (sans publication)
        run: docker build -f apps/web-paroisse/Dockerfile --build-arg API_URL_INTERNE=http://api:4000 --build-arg NEXT_PUBLIC_SITE_URL=https://paroisse.example.invalid -t scout-web:ci .

      - name: Application district (sans publication)
        run: docker build -f apps/web-district/Dockerfile --build-arg API_URL_INTERNE=http://api:4000 --build-arg NEXT_PUBLIC_SITE_URL=https://district.example.invalid -t scout-district:ci .
