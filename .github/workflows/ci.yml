name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Lint, types, tests et build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Activer pnpm (corepack)
        run: corepack enable

      # Génère aussi le client Prisma (postinstall de @scout/api).
      - run: pnpm install --frozen-lockfile

      - name: Paquet partagé
        run: pnpm --filter @scout/shared build

      - name: Validation du schéma Prisma
        run: pnpm --filter @scout/api exec prisma validate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      - name: Lint
        run: pnpm -r lint

      - name: Vérification des types
        run: pnpm -r typecheck

      - name: Tests unitaires
        run: pnpm -r test

      - name: Build
        run: pnpm --filter @scout/api build && pnpm --filter @scout/web-paroisse build && pnpm --filter @scout/web-district build

  docker-build:
    name: Build des images Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: API (sans publication)
        run: docker build -f apps/api/Dockerfile -t scout-api:ci .

      - name: Frontend paroissial (sans publication)
        run: docker build -f apps/web-paroisse/Dockerfile -t scout-web:ci .

      - name: Application district (sans publication)
        run: docker build -f apps/web-district/Dockerfile -t scout-district:ci .
