packages:
  - apps/*
  - packages/*

# Paquets autorisés à exécuter leurs scripts d'installation (pnpm les bloque
# par défaut) : moteurs Prisma, compilateurs natifs et optimiseur d'images.
allowBuilds:
  '@nestjs/core': true
  '@prisma/engines': true
  '@swc/core': true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true
  # Télémétrie de swagger-ui : inutile, refusée.
  '@scarf/scarf': false
