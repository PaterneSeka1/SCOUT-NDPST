services:
  db:
    image: postgres:16-alpine
    container_name: scout_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: scout
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: scout_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scout -d scout_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Publié sur localhost uniquement : l'app tourne directement sur l'hôte
    # (pm2, pas de conteneur), et s'y connecte via 127.0.0.1:5434 — jamais
    # exposé à l'extérieur du VPS.
    ports:
      - "127.0.0.1:5434:5432"

volumes:
  postgres_data:
    driver: local
