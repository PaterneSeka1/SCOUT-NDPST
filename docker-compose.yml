services:
  db:
    image: postgres:16-alpine
    container_name: scout_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: scout
      POSTGRES_PASSWORD: scout_password
      POSTGRES_DB: scout_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scout -d scout_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ./my-app
      dockerfile: Dockerfile
    container_name: scout_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://scout:scout_password@db:5432/scout_db"
      NEXTAUTH_SECRET: "change-me-in-production"
      NEXTAUTH_URL: "http://localhost:3000"
    volumes:
      - ./my-app:/app
      - /app/node_modules
      - /app/.next

  adminer:
    image: adminer:latest
    container_name: scout_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - db
    environment:
      ADMINER_DEFAULT_SERVER: db

volumes:
  postgres_data:
    driver: local
