# Environnement de développement local.
#   - Par défaut (./start.sh) : base PostgreSQL + Adminer ; l'API et le frontend
#     tournent sur l'hôte (pnpm dev).
#   - Pile complète conteneurisée : docker compose --profile app up -d --build
services:
  db:
    image: postgres:16-alpine
    container_name: scout_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: scout
      POSTGRES_PASSWORD: scout_password
      POSTGRES_DB: scout_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scout -d scout_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: scout_adminer
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - db
    environment:
      ADMINER_DEFAULT_SERVER: db

  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: scout_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DATABASE_URL: "postgresql://scout:scout_password@db:5432/scout_db"
      # Secret de développement uniquement, jamais réutilisé ailleurs.
      JWT_ACCESS_SECRET: "developpement-local-uniquement-0123456789abcdef"
      URL_FRONTEND_PAROISSE: "http://localhost:3000"
      TRUST_PROXY: "uniquelocal"
      SWAGGER_ACTIF: "true"
    volumes:
      - fichiers:/donnees
    ports:
      - "127.0.0.1:4000:4000"

  web:
    profiles: ["app"]
    build:
      context: .
      dockerfile: apps/web-paroisse/Dockerfile
    container_name: scout_web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      API_URL_INTERNE: "http://api:4000"
    ports:
      - "127.0.0.1:3000:3000"

  district:
    profiles: ["app"]
    build:
      context: .
      dockerfile: apps/web-district/Dockerfile
    container_name: scout_district
    restart: unless-stopped
    depends_on:
      - api
    environment:
      API_URL_INTERNE: "http://api:4000"
    ports:
      - "127.0.0.1:3001:3000"

volumes:
  postgres_data:
    driver: local
  fichiers:
    driver: local
